name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # No Redis service container is needed: CacheService/RedisConnection failures
      # are caught and logged as warnings, never thrown, so an unreachable Redis is
      # safe. DAO integration tests DO need a real Postgres — they start one
      # themselves via the `docker` CLI directly (see PostgresIntegrationTestBase),
      # which works out of the box on GitHub-hosted runners (Docker is preinstalled
      # and the runner user already has daemon access). Mockito-mocked Service
      # tests don't touch a real DB at all; TransactionManager (the only place a
      # Service opens a real JDBC Connection) is intercepted via Mockito.mockStatic.
      # These dummy .env values only need to satisfy EnvConfig's format checks
      # (e.g. ENCRYPTION_KEY's 32-char minimum) at class-load time.
      - name: Generate dummy .env for tests
        run: |
          cat > .env <<'EOF'
          DB_URL=jdbc:postgresql://localhost:5432/hospital_ci
          DB_USER=ci_user
          DB_PASSWORD=ci_password
          CLOUDINARY_CLOUD_NAME=ci-cloud
          CLOUDINARY_API_KEY=000000000000000
          CLOUDINARY_API_SECRET=ci-api-secret
          GMAIL_HOST=smtp.gmail.com
          GMAIL_PORT=587
          GMAIL_USERNAME=ci@example.com
          GMAIL_PASSWORD=ci-app-password
          GMAIL_FROM_NAME=Hospital Management System
          JWT_SECRET=ci-jwt-secret-not-for-production-use-only-in-ci
          JWT_EXPIRY_HOURS=24
          BCRYPT_ROUNDS=10
          ENCRYPTION_KEY=ci-encryption-key-at-least-32-characters-long
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=
          APP_PAGE_SIZE=20
          APP_MAX_UPLOAD_SIZE_MB=10
          EOF

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Install Xvfb for JavaFX toolkit init
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # EventBusTest starts the real JavaFX toolkit (Platform.startup) to test
      # EventBus's Platform.runLater dispatch path, which needs a display —
      # ubuntu-latest is headless, so this runs under a virtual framebuffer.
      - name: Run tests
        run: xvfb-run --auto-servernum ./mvnw -B test

      - name: Publish test results
        if: ${{ always() && hashFiles('target/surefire-reports/*.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
